profile_version: 1
dataset:
  format: LeRobotDataset-v3
  representation: lerobot-openarm-v1
  robot_type: bi_openarm_follower
  joint_order: left_then_right
  joint_units: degrees
  fps: 30
  cameras:
    - observation.images.left_wrist
    - observation.images.right_wrist
    - observation.images.base
  state: observation.state
  action: action
policy:
  type: act
  # Deliberately unresolved until `./openarm-fold report` profiles the first
  # 25 accepted episodes. Training refuses to guess this value.
  chunk_size: null
steps: 100000
batch_size: 8
device: cuda
wandb: false
deployment:
  authorized: false
  note: Real-robot policy deployment is a separate safety-gated task.
