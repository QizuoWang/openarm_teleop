nodes:
  - id: ui
    build: pip install -e nodes/dora-openarm-data-collection-ui
    path: dora-openarm-data-collection-ui
    env:
      METADATA_FILE: "metadata.yaml"
      SESSION_FILE: ".openarm-fold/session.yaml"
      DATASET_DIRECTORY: "folding_data/dataset"
      MINIMUM_FREE_GIB: 50
    inputs:
      tick: dora/timer/secs/1
      button_a:
        source: udp-receiver/button_a
        queue_size: 100
      button_b:
        source: udp-receiver/button_b
        queue_size: 100
      button_x:
        source: udp-receiver/button_x
        queue_size: 100
      button_y:
        source: udp-receiver/button_y
        queue_size: 100
      joystick_y_left:
        source: udp-receiver/joystick_y_left
        queue_size: 100
      vr_receive_times:
        source: udp-receiver/vr_receive_times
        queue_size: 100
      camera_wrist_right:
        source: camera-wrist-right/image
        queue_size: 1
      camera_wrist_left:
        source: camera-wrist-left/image
        queue_size: 1
      camera_ceiling:
        source: camera-ceiling/image
        queue_size: 1
      arm_status_right:
        source: follower-right/status
      arm_status_left:
        source: follower-left/status
      recorder_status:
        source: recorder/status
    outputs:
      - command
      - arm_command

  - id: quittable-tick-camera
    build: pip install -e nodes/dora-openarm-quitter
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      # tick: dora/timer/millis/200 # 5Hz
      tick: dora/timer/millis/33 # 30fps
    outputs:
      - tick

  - id: quittable-tick-leader
    build: pip install -e nodes/dora-openarm-quitter
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      tick: dora/timer/millis/2
    outputs:
      - tick

  - id: udp-receiver
    build: pip install -e nodes/dora-openarm-vr
    path: dora-openarm-quest-receiver
    args: "--host 0.0.0.0 --port 5006 --gripper-calibration gripper_calibration.json"
    inputs:
      tick: quittable-tick-leader/tick
    outputs:
      - pose_right
      - trigger_right
      - pose_left
      - trigger_left
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - button_y
      - status
      - vr_receive_times

  - id: ik
    build: pip install -e nodes/dora-openarm-kinematics
    path: dora-openarm-ik
    args: "--mode bimanual --max-iters 10 --dt 0.002 --limit-velocity --damping 0.1 --posture-cost 0.01 --lm-damping 0.01"
    inputs:
      tick: quittable-tick-leader/tick
      target_right: udp-receiver/pose_right
      target_left: udp-receiver/pose_left
      trigger_right: udp-receiver/trigger_right
      trigger_left: udp-receiver/trigger_left
    outputs:
      - position_left
      - position_right
      - status

  - id: camera-wrist-right
    build: pip install -e nodes/dora-hikrobot-rgb-camera
    path: dora-hikrobot-rgb-camera
    env:
      HIKROBOT_MV3D_LIB: "/home/robot/openarm/hikrobot/Mv3dRgbdSDK_ROS2/src/hik_rgbd/lib"
      LD_LIBRARY_PATH: "/home/robot/openarm/hikrobot/Mv3dRgbdSDK_ROS2/src/hik_rgbd/lib"
      SERIAL_NUMBER: "00DA8573792"
      WORKING_MODE: 2
      IMAGE_MODE: 8
      IMAGE_HEIGHT: 360
      IMAGE_WIDTH: 640
      JPEG_QUALITY: 90
      FETCH_TIMEOUT_MS: 3000
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image

  - id: follower-right
    build: pip install -e nodes/dora-openarm
    path: dora-openarm
    args: "--side right --config openarm_pedestal_vr.yaml --align-trigger gripper"
    inputs:
      # Event ID is only used. Event value isn't used.
      request_state: ik/position_right
      move_position: ik/position_right
      command: ui/arm_command
    outputs:
      - state
      - status

  - id: follower-left
    build: pip install -e nodes/dora-openarm
    path: dora-openarm
    args: "--side left --config openarm_pedestal_vr.yaml --align-trigger gripper"
    inputs:
      request_state: ik/position_left
      move_position: ik/position_left
      command: ui/arm_command
    outputs:
      - state
      - status

  - id: camera-wrist-left
    build: pip install -e nodes/dora-hikrobot-rgb-camera
    path: dora-hikrobot-rgb-camera
    env:
      HIKROBOT_MV3D_LIB: "/home/robot/openarm/hikrobot/Mv3dRgbdSDK_ROS2/src/hik_rgbd/lib"
      LD_LIBRARY_PATH: "/home/robot/openarm/hikrobot/Mv3dRgbdSDK_ROS2/src/hik_rgbd/lib"
      SERIAL_NUMBER: "00DB1265540"
      WORKING_MODE: 2
      IMAGE_MODE: 8
      IMAGE_HEIGHT: 360
      IMAGE_WIDTH: 640
      JPEG_QUALITY: 90
      FETCH_TIMEOUT_MS: 3000
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image

  - id: camera-ceiling
    build: pip install -e nodes/dora-hikrobot-rgb-camera
    path: dora-hikrobot-rgb-camera
    env:
      HIKROBOT_MV3D_LIB: "/home/robot/openarm/hikrobot/Mv3dRgbdSDK_ROS2/src/hik_rgbd/lib"
      LD_LIBRARY_PATH: "/home/robot/openarm/hikrobot/Mv3dRgbdSDK_ROS2/src/hik_rgbd/lib"
      SERIAL_NUMBER: "00DA8573794"
      WORKING_MODE: 2
      IMAGE_MODE: 8
      IMAGE_HEIGHT: 360
      IMAGE_WIDTH: 640
      JPEG_QUALITY: 90
      FETCH_TIMEOUT_MS: 3000
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image

  - id: recorder
    build: pip install -e nodes/dora-openarm-dataset-recorder
    path: dora-openarm-dataset-recorder
    env:
      METADATA_FILE: "metadata.yaml"
      DIRECTORY: "folding_data"
    inputs:
      command: ui/command
      arm_right_action: ik/position_right
      arm_right_observation: follower-right/state
      arm_left_action: ik/position_left
      arm_left_observation: follower-left/state
      camera_wrist_right: camera-wrist-right/image
      camera_wrist_left: camera-wrist-left/image
      camera_ceiling: camera-ceiling/image
    outputs:
      - status
